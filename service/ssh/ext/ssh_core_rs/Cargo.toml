[package]
name = "ssh_core_rs"
version = "1.0.0"
edition = "2021"
description = "Rust SSH core engine — IPC-compatible replacement for Erlang ssh_core"

[[bin]]
name = "ssh_core_rs"
path = "src/main.rs"

[dependencies]
# 禁用默认特性（aws-lc-rs 需要 NASM/C11），改用 ring（纯 Rust 加密后端）
# 不启用 async-trait：russh 0.61 的 Handler trait 使用原生 AFIT（impl Future），
# 启用 async-trait 会导致 impl 与 trait 的生命周期签名不匹配（E0195）
russh = { version = "0.61", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
dashmap = "6"
rand = "0.8"
sha2 = "0.10"
russh-sftp = "2.4.0"

[profile.release]
opt-level = 3
lto = true
